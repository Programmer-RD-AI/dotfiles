unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g extended-keys on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

set -g mouse on

# Vi mode
setw -g mode-keys vi

# Modern copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes using arrow keys with the prefix
bind -r Up resize-pane -U
bind -r Down resize-pane -D
bind -r Left resize-pane -L
bind -r Right resize-pane -R

# Window navigation: n = next, b = back
bind b previous-window

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Status bar design
set -g status-style "bg=default fg=colour255"
set -g status-left-length 40
set -g status-right-length 60
set -g status-position top

# Pane border
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour255

# Modern status bar
set -g status-left "#[fg=colour255,bold] #S "
set -g status-right "#{prefix_highlight} #[fg=colour244]#{cpu_icon} #{cpu_percentage} #[fg=colour244]#{ram_icon} #{ram_percentage} #[fg=colour244]#H #[fg=colour255,bold]%H:%M "
set -g status-interval 2

# Window status
setw -g window-status-format "#[fg=colour244] #I #W "
setw -g window-status-current-format "#[fg=colour255,bold] #I #W "

# Set escape time to 0
set -sg escape-time 0

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.dotfiles/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'noscript/tmux-mighty-scroll'

# Plugin settings
set -g @cpu_low_icon "󰾆"
set -g @cpu_medium_icon "󰾅"
set -g @cpu_high_icon "󰓅"
set -g @ram_low_icon "󰍛"
set -g @ram_medium_icon "󰍛"
set -g @ram_high_icon "󰍛"
set -g @cpu_percentage_format "%5.1f%%"
set -g @ram_percentage_format "%5.1f%%"

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @tmux-autoreload-configs '~/.dotfiles/tmux/tmux.conf'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @tmux-fzf-launch-key 'F'

run '~/.dotfiles/tmux/plugins/tpm/tpm'
