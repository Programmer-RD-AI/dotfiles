# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    gaps_in = 8
    gaps_out = 20

    # Black / gray border scheme
    col.active_border = rgba(888888ff) rgba(444444ff) 45deg
    col.inactive_border = rgba(1a1a1aaa)

    # Mouse drag on borders/gaps to resize tiles
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    rounding = 12

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    enabled = yes

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = wsSlide, 0.16, 1, 0.3, 1
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.36, 0, 0.66, -0.56

    animation = workspaces, 1, 6, wsSlide, slide
    animation = specialWorkspace, 1, 6, wsSlide, slidevert

    animation = windows, 1, 5, winIn, popin 80%
    animation = windowsIn, 1, 5, winIn, popin 80%
    animation = windowsOut, 1, 4, winOut, popin 80%
    animation = windowsMove, 1, 4, smoothIn, slide
    animation = fade, 1, 5, smoothIn
    animation = fadeIn, 1, 5, smoothIn
    animation = fadeOut, 1, 4, smoothOut
    animation = border, 1, 6, smoothIn
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
