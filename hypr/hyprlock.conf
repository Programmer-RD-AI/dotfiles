# Self-contained hyprlock — black aesthetic with built-in animations.
# Anims reference: hyprwm/hyprlock PR #631 (animation manager), wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Layout inspired by catppuccin/hyprlock and the ashish-kus minimal gist.

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true

    bezier = easeOut, 0.25, 0.46, 0.45, 0.94
    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = pop, 0.34, 1.56, 0.64, 1

    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeInOut
    animation = inputFieldColors, 1, 4, easeInOut
    animation = inputFieldFade, 1, 6, easeOut
    animation = inputFieldWidth, 1, 5, pop
    animation = inputFieldDots, 1, 3, easeOut
}

background {
    monitor =
    path = /home/prdai/dotfiles/wallpapers/gojo-jjk.png
    blur_passes = 3
    blur_size = 5
    brightness = 0.4
    contrast = 0.95
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgba(255, 255, 255, 1)
    font_size = 140
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgba(255, 255, 255, 1)
    font_size = 140
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -230
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.55)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -270
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    position = 0, 100
    halign = center
    valign = bottom

    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.20)
    inner_color = rgba(0, 0, 0, 0.55)
    check_color = rgba(255, 255, 255, 0.85)
    fail_color = rgba(255, 80, 80, 0.85)
    capslock_color = rgba(255, 200, 80, 0.85)

    font_color = rgba(255, 255, 255, 0.95)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffff80">enter password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 25
    fade_on_empty = true
    fade_timeout = 1500

    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    shadow_passes = 0
}

auth {
    fingerprint:enabled = false
}
